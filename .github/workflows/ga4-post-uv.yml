name: Update GA4 Post UV

on:
  workflow_call:
    outputs:
      changed:
        description: Whether post UV data changed
        value: ${{ jobs.update-post-uv.outputs.changed }}
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-post-uv:
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Authenticate to Google
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GA4_SERVICE_ACCOUNT_KEY }}

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install google-analytics-data

      - name: Baseline against latest published data
        # master keeps a frozen snapshot of the UV files; the live values sit
        # on post-views-data. Overlay them before exporting so the changed
        # check compares against what was actually published last run.
        run: |
          if git fetch origin post-views-data 2>/dev/null; then
            git checkout FETCH_HEAD -- _data/post_uv.json _data/post_uv_meta.json || true
          fi

      - name: Export post UV data
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          # Optional: set GA4_START_DATE in repo secrets/variables if you want a fixed date.
          GA4_START_DATE: ${{ secrets.GA4_START_DATE }}
        run: |
          python scripts/ga4_export_uv.py

      - name: Commit and push if changed
        id: commit
        run: |
          # post_uv_meta.json carries a generated_at timestamp that changes
          # every run, so gate on the actual view counts only.
          if [ -n "$(git status --porcelain -- _data/post_uv.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add _data/post_uv.json _data/post_uv_meta.json
            git commit -m "Update post views data"
            # Publish to a dedicated data branch instead of master, so daily
            # refreshes stop flooding the main history. deploy.yml overlays
            # these two files at build time.
            git push --force origin "HEAD:refs/heads/post-views-data"
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "No changes"
            echo "changed=false" >> $GITHUB_OUTPUT
          fi
